<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/branding/logo/SimpleWorship-icon.svg" />
    <link rel="shortcut icon" href="/branding/logo/SimpleWorship.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleWorship - Presentation Platform</title>
    <meta name="description" content="Professional standalone worship presentation platform featuring schedules, dual preview/live monitors, scriptures, songs, media library, and multi-output projection." />
    <meta property="og:title" content="SimpleWorship - Presentation Platform" />
    <meta property="og:description" content="Professional standalone worship presentation platform featuring schedules, dual preview/live monitors, scriptures, songs, media library, and multi-output projection." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0c0d10;
        color: #f1f5f9;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: #0c0d10;
      }
      body.projector-mode, html.projector-mode, .projector-mode #root, #root.projector-mode {
        background-color: #000000;
      }
    </style>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        console.error('[Early Startup Error]', msg, src, line, col, err);
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="background:#0c0d10;color:#f87171;padding:32px;font-family:system-ui,sans-serif;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;"><h2 style="color:#ffffff;margin-bottom:8px;font-size:20px;">SimpleWorship Startup Notice</h2><p style="color:#94a3b8;max-width:500px;font-size:14px;margin-bottom:20px;">' + (typeof msg === 'string' ? msg : 'Starting up workspace...') + '</p><button onclick="window.location.reload()" style="background:#2563eb;color:#ffffff;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-weight:600;">Reload App</button></div>';
        }
      };
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[Early Unhandled Rejection]', e.reason);
      });
    </script>
  </head>
  <body class="bg-[#0c0d10] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
