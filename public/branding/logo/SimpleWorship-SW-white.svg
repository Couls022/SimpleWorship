<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sw-full-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#001833" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="w-full-wing" x1="140" y1="210" x2="250" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#004AE8" />
      <stop offset="35%" stop-color="#0066FF" />
      <stop offset="75%" stop-color="#00B2FE" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="w-full-fold" x1="120" y1="120" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#0077FE" />
      <stop offset="100%" stop-color="#00358E" />
    </linearGradient>

    <linearGradient id="s-full-white" x1="30" y1="40" x2="140" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="s-full-depth" x1="20" y1="60" x2="130" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

