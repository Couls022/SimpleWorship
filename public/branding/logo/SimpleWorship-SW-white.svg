    <path d="M 165 396 C 185 396, 230 380, 268 280 C 275 260, 283 242, 290 238 C 298 234, 308 240, 314 252 L 340 342 C 348 370, 330 396, 298 396 L 165 396 Z" fill="#00358E" />
    <path d="M 264 285 C 255 310, 240 350, 205 385 C 230 385, 260 360, 282 305 C 295 272, 305 245, 318 242 C 326 240, 332 248, 335 258 L 302 365 C 298 380, 288 392, 270 394 Z" fill="url(#w-full-fold)" />
    <path d="M 296 396 C 308 396, 318 390, 324 378 L 476 106 C 484 92, 478 78, 464 78 C 452 78, 442 84, 436 96 L 284 368 C 278 382, 284 396, 296 396 Z" fill="url(#w-full-wing)" />
    
    <!-- 3D S -->
    <path d="M 46 398 C 40 398, 36 394, 38 386 L 168 386 C 220 386, 268 360, 268 296 C 268 244, 230 220, 180 206 C 136 194, 116 182, 116 160 C 116 138, 136 122, 168 122 C 210 122, 246 142, 264 162 L 298 122 C 268 90, 218 76, 168 76 C 104 76, 56 112, 56 172 C 56 226, 96 250, 148 264 C 196 278, 208 290, 208 310 C 208 334, 184 348, 146 348 L 46 348 L 22 398 Z" fill="url(#s-full-depth)" />
