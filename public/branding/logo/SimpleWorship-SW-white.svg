    <path d="M 172 82 C 218 82, 264 96, 292 124 L 284 134 C 258 108, 216 94, 172 94 C 118 94, 76 124, 74 168 C 72 136, 114 82, 172 82 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography: SimpleWorship -->
  <text x="270" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-size="96" font-weight="600" fill="#FFFFFF" letter-spacing="-1.5">
    Simple<tspan font-weight="700" fill="#00D2FF">Worship</tspan>
  </text>
